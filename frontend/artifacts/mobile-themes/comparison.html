<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Theme verification</title><style>body{background:#15191c;color:#edf4f5;font:16px system-ui;margin:24px}h1{font-size:24px}main{display:flex;gap:24px;align-items:start;overflow-x:auto;padding-bottom:16px}figure{margin:0;flex:none}figcaption{margin:12px 0}img{width:375px;height:auto;max-width:none}select{font:inherit;margin:12px;padding:6px}p{max-width:850px}</style><h1>Preserved Green / new themes</h1><p>Matching browser captures. The new selector occupies existing space; the underlying layout is unchanged. Physical iOS 16 testing has not been performed.</p><label>Viewport <select id="width"><option>320</option><option selected>375</option><option>390</option><option>430</option><option>1440</option></select></label><main><figure><figcaption>Green — before</figcaption><img data-theme="before" src="before-375.png" alt="Original Green"></figure><figure><figcaption>Green — after</figcaption><img data-theme="green" src="green-375.png" alt="Updated Green"></figure><figure><figcaption>Cyber Blue</figcaption><img data-theme="blue" src="blue-375.png" alt="Cyber Blue"></figure><figure><figcaption>Crimson Red</figcaption><img data-theme="red" src="red-375.png" alt="Crimson Red"></figure></main><script>document.querySelector('select').addEventListener('change',function(){for(const img of document.querySelectorAll('img')){img.src=img.dataset.theme+'-'+this.value+'.png';img.style.width=this.value+'px'}})</script></html>
